[package]
name = "git-meta-bench"
description = "Scale benchmarks for git-meta: large metadata histories, prune settings, and sparse fetch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "git-meta-bench"
path = "src/main.rs"

[dependencies]
git-meta-lib = { path = "../git-meta-lib", features = ["internal"] }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
gix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
